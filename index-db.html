<!doctype html>
<html>
  <head>
    <title>Smart Queue Management System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Smart Queue Management System</h1>
      <p>Manage customer tokens and waiting time easily.</p>

      <div class="box">
        <h2>Add Customer</h2>

        <input
          type="text"
          id="customerName"
          placeholder="Enter customer name"
        />

        <button onclick="addCustomer()">Generate Token</button>
      </div>

      <div class="box">
        <h2>Waiting Queue</h2>

        <ul id="queueList"></ul>

        <button onclick="serveCustomer()">Serve Next Customer</button>
      </div>

      <div class="box">
        <h2>Queue Statistics</h2>

        <p>Total Waiting Customers: <span id="total">0</span></p>

        <p>Next Token Number: <span id="nextToken">101</span></p>

        <p>
          Estimated Waiting Time for the Last Token:
          <span id="waitingTime">0</span> minutes
        </p>
      </div>
    </div>

    <script src="script_db.js"></script>
  </body>
</html>
